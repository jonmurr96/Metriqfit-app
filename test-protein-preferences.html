<!DOCTYPE html>
<html>
<head>
  <title>Test Protein Preferences</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <h1>Protein Preferences Test</h1>
  <div id="status">Loading...</div>
  <pre id="result"></pre>
  
  <script>
    const SUPABASE_URL = 'https://hatskscplygyrrpepqmx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhdHNrc2NwbHlneXJycGVwcW14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzc0MjQ5MzcsImV4cCI6MjA1MzAwMDkzN30.l8TleVZ4g0ywTz1Vxl0mnq4CyW59ZGwRWE4blDjL1Gk';
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    async function test() {
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      
      try {
        // Sign in first
        const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({
          email: 'jmgt@kl.com',
          password: 'password123'
        });
        
        if (signInError) throw signInError;
        
        status.textContent = 'Signed in, fetching onboarding data...';
        
        // Get onboarding answers
        const { data: onboardingData, error: onboardingError } = await supabase
          .from('onboarding_answers')
          .select('answers')
          .eq('user_id', signInData.user.id)
          .single();
        
        if (onboardingError) throw onboardingError;
        
        const preferredProteins = onboardingData.answers.preferred_proteins || [];
        
        status.textContent = 'Triggering plan regeneration with preferred proteins...';
        
        // Call the edge function to regenerate plans
        const { data: planData, error: planError } = await supabase.functions.invoke('generate-user-plans', {
          body: {
            userId: signInData.user.id,
            planType: 'both',
            activationMode: 'activate',
            nutritionRegeneration: {
              preferred_proteins: preferredProteins,
              start_fresh: true
            }
          }
        });
        
        if (planError) throw planError;
        
        status.textContent = 'Plan regenerated successfully!';
        result.textContent = JSON.stringify(planData, null, 2);
        
      } catch (error) {
        status.textContent = 'Error: ' + error.message;
        result.textContent = JSON.stringify(error, null, 2);
      }
    }
    
    test();
  </script>
</body>
</html>
