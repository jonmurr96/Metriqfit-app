# Supabase CLI function configuration.
#
# User-facing functions use `verify_jwt = false` at the gateway because Supabase's
# gateway JWT validator only accepts the project's HS256 token and rejects Clerk's
# RS256 third-party tokens with `Invalid JWT`. Each user-facing function instead
# verifies the Clerk JWT itself via the shared `_shared/clerkAuth.ts` helper
# (JWKS, pinned issuer). Admin batch functions (migrate-workout-plans-v2,
# remediate-workout-mappings) stay verify_jwt=false because they are secret-gated
# and not called with a user's session.

[functions.import-recipe-url]
verify_jwt = false

[functions.menu-scan-rank]
verify_jwt = false

[functions.search-food-catalog]
verify_jwt = false

[functions.upsert-external-food-item]
verify_jwt = false

[functions.confirm-serving]
verify_jwt = false

[functions.analyze-food-photo]
verify_jwt = false

